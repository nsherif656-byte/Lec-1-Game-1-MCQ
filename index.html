<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Accounting MCQ Challenge</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e3a8a);
        min-height: 100vh;
        color: #111827;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
    }
    .game {
        width: 100%;
        max-width: 650px;
        background: white;
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 15px 45px rgba(0,0,0,.3);
    }
    h1 {
        text-align: center;
        margin: 0 0 6px;
        color: #1e3a8a;
        font-size: 27px;
    }
    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 18px;
    }
    .topbar {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 18px;
        font-weight: bold;
    }
    .badge {
        background: #eff6ff;
        color: #1d4ed8;
        padding: 9px 12px;
        border-radius: 12px;
        font-size: 14px;
    }
    .question {
        font-size: 20px;
        line-height: 1.45;
        font-weight: 700;
        margin: 15px 0 20px;
    }
    .option {
        width: 100%;
        text-align: left;
        border: 2px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 14px;
        padding: 15px;
        margin: 10px 0;
        font-size: 17px;
        cursor: pointer;
        transition: .15s;
        -webkit-tap-highlight-color: transparent;
    }
    .option:hover { border-color: #3b82f6; background: #eff6ff; }
    .option:disabled { cursor: default; opacity: .95; }
    .correct { background: #dcfce7 !important; border-color: #16a34a !important; color: #166534; }
    .wrong { background: #fee2e2 !important; border-color: #dc2626 !important; color: #991b1b; }
    #result {
        display: none;
        text-align: center;
        margin: 20px 0 5px;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 1px;
    }
    #result.win { color: #16a34a; }
    #result.loser { color: #dc2626; }
    .feedback {
        text-align: center;
        min-height: 28px;
        font-weight: bold;
        font-size: 17px;
    }
    .next, .restart {
        display: none;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 15px;
        margin-top: 14px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: #1d4ed8;
        cursor: pointer;
    }
    .next:hover, .restart:hover { background: #1e40af; }
    .final {
        display: none;
        text-align: center;
    }
    .final h2 { font-size: 30px; color: #1e3a8a; }
    .score {
        font-size: 25px;
        font-weight: bold;
        margin: 20px 0;
    }
    .progress {
        height: 8px;
        background: #e2e8f0;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 18px;
    }
    .progress-bar {
        height: 100%;
        width: 0%;
        background: #2563eb;
        transition: width .25s;
    }
    @media (max-width: 480px) {
        .game { padding: 17px; border-radius: 18px; }
        h1 { font-size: 23px; }
        .question { font-size: 18px; }
        .option { font-size: 16px; padding: 14px; }
    }
</style>
</head>
<body>

<div class="game">
    <h1>📚 Accounting MCQ Challenge</h1>
    <div class="subtitle">Test your knowledge of the basic accounting activities</div>

    <div id="quiz">
        <div class="topbar">
            <div class="badge" id="questionNumber">Question 1 / 5</div>
            <div class="badge" id="score">Score: 0</div>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question" id="question"></div>
        <div id="options"></div>

        <div id="result"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next" id="nextButton">Next Question ➜</button>
    </div>

    <div class="final" id="final">
        <h2>🎉 Quiz Completed!</h2>
        <div class="score" id="finalScore"></div>
        <div id="finalMessage"></div>
        <button class="restart" id="restartButton">🔄 Play Again</button>
    </div>
</div>

<script>
const questions = [
    {
        question: "Which activity ensures that only events affecting the organization's financial position are captured?",
        options: [
            "a) Communicating",
            "b) Recording",
            "c) Identification",
            "d) Interpretation"
        ],
        answer: 2
    },
    {
        question: "After recording economic events, the necessary data is provided to users in …… activity",
        options: [
            "a) Identification",
            "b) Communicating",
            "c) Marketing",
            "d) Production"
        ],
        answer: 1
    },
    {
        question: "What is the correct sequential order of the basic accounting activities?",
        options: [
            "a) Recording, Identification, Communicating",
            "b) Communicating, Recording, Identification",
            "c) Identification, Recording, Communicating",
            "d) Identification, Communicating, Recording"
        ],
        answer: 2
    },
    {
        question: "Which activity involves explaining what the numbers in the financial reports mean?",
        options: [
            "a) Identification",
            "b) Recording",
            "c) Communicating (specifically, Interpretation)",
            "d) Classification"
        ],
        answer: 2
    },
    {
        question: "The final core activity in the accounting process is:",
        options: [
            "a) Identification",
            "b) Recording",
            "c) Communicating",
            "d) Auditing"
        ],
        answer: 2
    }
];

let current = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const resultEl = document.getElementById("result");
const feedbackEl = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");
const scoreEl = document.getElementById("score");
const questionNumberEl = document.getElementById("questionNumber");
const progressBar = document.getElementById("progressBar");

function loadQuestion() {
    answered = false;
    const q = questions[current];

    questionNumberEl.textContent = `Question ${current + 1} / ${questions.length}`;
    scoreEl.textContent = `Score: ${score}`;
    progressBar.style.width = `${(current / questions.length) * 100}%`;

    questionEl.textContent = q.question;
    optionsEl.innerHTML = "";
    resultEl.style.display = "none";
    resultEl.className = "";
    feedbackEl.textContent = "";
    nextButton.style.display = "none";

    q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = option;
        button.onclick = () => checkAnswer(index, button);
        optionsEl.appendChild(button);
    });
}

function checkAnswer(selected, clickedButton) {
    if (answered) return;
    answered = true;

    const q = questions[current];
    const buttons = document.querySelectorAll(".option");

    buttons.forEach(btn => btn.disabled = true);

    if (selected === q.answer) {
        score++;
        clickedButton.classList.add("correct");
        resultEl.textContent = "WIN 🏆";
        resultEl.classList.add("win");
        resultEl.style.display = "block";
        feedbackEl.textContent = "Correct answer! Excellent work.";
    } else {
        clickedButton.classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        resultEl.textContent = "LOSER ❌";
        resultEl.classList.add("loser");
        resultEl.style.display = "block";
        feedbackEl.textContent = "Wrong answer. The correct answer is highlighted in green.";
    }

    scoreEl.textContent = `Score: ${score}`;
    nextButton.textContent = current === questions.length - 1 ? "Finish Quiz 🏁" : "Next Question ➜";
    nextButton.style.display = "block";
}

nextButton.onclick = () => {
    if (current < questions.length - 1) {
        current++;
        loadQuestion();
    } else {
        showFinal();
    }
};

function showFinal() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("final").style.display = "block";

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById("finalScore").textContent =
        `Your Score: ${score} / ${questions.length} (${percentage}%)`;

    let message;
    if (percentage === 100) {
        message = "🏆 Perfect! Outstanding performance!";
    } else if (percentage >= 80) {
        message = "👏 Excellent work!";
    } else if (percentage >= 60) {
        message = "👍 Good job! Keep practicing.";
    } else {
        message = "📖 Keep studying and try again!";
    }

    document.getElementById("finalMessage").textContent = message;
    document.getElementById("restartButton").style.display = "block";
}

document.getElementById("restartButton").onclick = () => {
    current = 0;
    score = 0;
    document.getElementById("quiz").style.display = "block";
    document.getElementById("final").style.display = "none";
    loadQuestion();
};

loadQuestion();
</script>

</body>
</html>
